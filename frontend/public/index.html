<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Archivos</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="theme-toggle">
    <button id="toggleTheme">🌙</button>
  </div>

  <div class="container">
    <h1>Conversor de Archivos</h1>

    <div class="upload-box" id="dropZone">
      <label class="upload-label">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span>Arrastra o haz click para subir archivos</span>
      </label>
      <input type="file" id="file" name="file" multiple hidden>
      <div id="fileList" class="file-list"></div>
    </div>

    <form id="converterForm">
      <label for="format">Formato de salida:</label>
      <select id="format" name="format">
        <option value="pdf">PDF</option>
        <option value="jpg">JPG</option>
        <option value="png">PNG</option>
        <option value="webp">WEBP</option>
        <option value="mp3">MP3</option>
        <option value="mp4">MP4</option>
      </select>

      <label for="size">Tamaño máximo (KB, opcional):</label>
      <input type="number" id="size" name="size" placeholder="Ej: 500">

      <button type="submit" id="convertBtn">Convertir</button>
    </form>

    <div id="progressContainer" class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
      <span id="progressText">0%</span>
    </div>

    <div id="message" class="toast"></div>

    <h2>Historial de conversiones</h2>
    <ul id="history" class="history-list"></ul>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
